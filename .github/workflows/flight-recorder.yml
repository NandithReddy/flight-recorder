name: flight-recorder

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. No secrets, no models, no network beyond npm.
  # ---------------------------------------------------------------------------
  build:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test

      # Suites are committed, but their baselines live in a gitignored database.
      # This proves the exported bundles actually make them runnable on a machine
      # that has never seen this project, checked on every push rather than
      # assumed.
      - name: suites are portable
        run: |
          npm run fr -- import --suite demo
          npm run fr -- import --suite metrics
          npm run fr -- doctor --suite demo
          npm run fr -- doctor --suite metrics

  # ---------------------------------------------------------------------------
  # Proves the gate actually catches a regression — with no models and no
  # secrets, so it runs for anyone who forks this.
  #
  # The deterministic mock has a degraded variant that fails in the way real
  # agents fail: it skips its verification step and answers confidently with an
  # unchecked number. Nothing throws. The gate has to notice anyway.
  #
  # This job passes when the gate FAILS, because that is the behaviour under
  # test. A gate that cannot be shown to fire is not a gate.
  # ---------------------------------------------------------------------------
  gate-selftest:
    name: gate catches a known regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: load committed baselines
        run: npm run fr -- import --suite demo

      - name: run both configurations
        run: |
          npm run fr -- matrix --suite demo --provider mock \
            --models demo-model --prompts v1,v2-degraded --modes live --concurrency 4

      - name: the gate must fail on the degraded prompt
        run: |
          if npm run fr --silent -- gate --suite demo --provider mock \
               --baseline "demo-model#v1" --candidate "demo-model#v2-degraded" --no-judge; then
            echo "::error::The gate passed a known regression. That is the bug this repo exists to prevent."
            exit 1
          fi
          echo "Gate correctly blocked the degraded prompt."

      - name: and must pass when nothing changed
        run: |
          npm run fr -- gate --suite demo --provider mock \
            --baseline "demo-model#v1" --candidate "demo-model#v1" --no-judge

  # ---------------------------------------------------------------------------
  # The real gate, against live models. Opt-in: it needs a credential, and a job
  # that fails for want of a secret teaches people to ignore red builds.
  # ---------------------------------------------------------------------------
  gate:
    name: regression gate (hosted models)
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: check for a provider credential
        id: creds
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -n "$AI_GATEWAY_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No AI_GATEWAY_API_KEY set — skipping the hosted gate. The mock gate self-test still ran."
          fi

      - name: load committed baselines
        if: steps.creds.outputs.available == 'true'
        run: npm run fr -- import --suite metrics

      - name: run the matrix
        if: steps.creds.outputs.available == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          npm run fr -- matrix --suite metrics --provider gateway \
            --models anthropic/claude-haiku-4.5 --modes live,stubbed --concurrency 4

      - name: gate
        if: steps.creds.outputs.available == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          npm run fr -- gate --suite metrics --provider gateway \
            --baseline qwen2.5:7b --candidate anthropic/claude-haiku-4.5 \
            --set metrics --critical-tag p0 --out report.html

      # Uploaded whether or not the gate passed — the report is most useful
      # exactly when the build is red.
      - name: upload report
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flight-recorder-report
          path: report.html
          retention-days: 30
